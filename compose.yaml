services:
  web:
    init: true
    stop_grace_period: 30s
    build:
      context: .
      args:
        ASTNODE_ASTERISK_GID: ${ASTERISK_GID:-1000}
    image: asterisk-node-manager:local
    command: ["astnode-web"]
    environment:
      ASTNODE_WEB__DEMO_MODE: "false"
      ASTNODE_ASTERISK_GID: ${ASTERISK_GID:-}
      ASTNODE_NETWORKS__PROFILES_ENABLED: ${NETWORK_PROFILES_ENABLED:-false}
      ASTNODE_NETWORKS__DEFAULT_NETWORK: ${DEFAULT_NETWORK:-allstarlink}
      ASTNODE_PATHS__WRITER_SOCKET: /run/asterisk-node-manager/writer.sock
      ASTNODE_PATHS__ASTERISK_DIRECTORY: /etc/asterisk
    ports:
      - "127.0.0.1:8765:8765"
    logging:
      driver: local
    volumes:
      - manager-data:/var/lib/asterisk-node-manager
      - writer-run:/run/asterisk-node-manager
      - /var/run/asterisk:/var/run/asterisk
      - ./docker/writers:/etc/asterisk-node-manager/writers
      - ./network-profiles:/etc/asterisk-node-manager/networks:ro
    depends_on:
      writer:
        condition: service_healthy
    restart: unless-stopped

  writer:
    init: true
    stop_grace_period: 30s
    image: asterisk-node-manager:local
    build:
      context: .
      args:
        ASTNODE_ASTERISK_GID: ${ASTERISK_GID:-1000}
    command: ["astnode-writer"]
    user: root
    environment:
      ASTNODE_PATHS__DATABASE: /var/lib/asterisk-node-manager/manager.sqlite3
      ASTNODE_PATHS__WRITER_SOCKET: /run/asterisk-node-manager/writer.sock
      ASTNODE_PATHS__ASTERISK_DIRECTORY: /etc/asterisk
      ASTNODE_NETWORKS__PROFILES_ENABLED: ${NETWORK_PROFILES_ENABLED:-false}
      ASTNODE_NETWORKS__DEFAULT_NETWORK: ${DEFAULT_NETWORK:-allstarlink}
      ASTNODE_ASTERISK_GID: ${ASTERISK_GID:-}
    volumes:
      - manager-data:/var/lib/asterisk-node-manager
      - writer-run:/run/asterisk-node-manager
      - ${ASTERISK_CONFIG_DIRECTORY:-./asterisk-config}:/etc/asterisk
      - ./network-profiles:/etc/asterisk-node-manager/networks:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import sys; sys.exit(0 if Path('/run/asterisk-node-manager/writer.sock').is_socket() else 1)"]
      interval: 2s
      timeout: 1s
      retries: 15
    restart: unless-stopped

volumes:
  manager-data:
  writer-run:
