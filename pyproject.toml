[build-system]
requires = ["hatchling>=1.12.2"]
build-backend = "hatchling.build"

[project]
name = "asterisk-node-manager"
version = "0.1.0"
description = "Manage Asterisk node configuration through a local database, CLI, and web interface"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Asterisk Node Manager contributors" }]
dependencies = ["Alembic>=1.8", "Flask>=2.2", "Jinja2>=3.0", "python-pam>=2.0", "SQLAlchemy>=1.4.24", "waitress>=2.1"]
classifiers = [
  "Environment :: Console",
  "Environment :: Web Environment",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Telephony",
]

[project.scripts]
astnode = "asterisk_node_manager.cli:main"
astnode-web = "asterisk_node_manager.web:main"
astnode-writer = "asterisk_node_manager.writer:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asterisk_node_manager"]

[tool.hatch.build]
include = ["src/asterisk_node_manager/web/templates/**", "src/asterisk_node_manager/web/static/**", "src/asterisk_node_manager/conf/**", "src/asterisk_node_manager/migrations/**", "src/asterisk_node_manager/alembic.ini"]
