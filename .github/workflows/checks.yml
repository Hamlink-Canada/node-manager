name: checks

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: pytest
      - run: python -m build

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and smoke-test both image architectures
        run: |
          docker compose -f compose.yaml config -q
          for platform in linux/amd64 linux/arm64; do
            docker buildx build --load --platform "$platform" --tag node-manager:check .
            docker run --rm --platform "$platform" --entrypoint astnode node-manager:check --help
            docker run --rm --platform "$platform" --entrypoint python node-manager:check -c \
              'import asterisk_node_manager, alembic, flask, jinja2, sqlalchemy'
          done
      - id: tags
        env:
          REF: ${{ github.event.release.tag_name || github.ref_name }}
          RELEASE: ${{ github.event_name == 'release' }}
          PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          image=ghcr.io/hamlink-canada/node-manager
          if [ "$RELEASE" = true ]; then
            if ! printf '%s' "$REF" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
              echo 'Invalid release version' >&2
              exit 1
            fi
          fi
          {
            echo 'tags<<EOF'
            if [ "$RELEASE" = true ]; then
              version=${REF#v}
              echo "$image:$version"
              if [ "$PRERELEASE" != true ] && ! printf '%s' "$version" | grep -q -- '-'; then
                echo "$image:latest"
              fi
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'release'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
